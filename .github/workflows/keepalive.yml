name: Keep Streamlit app awake

on:
  schedule:
    # UTC 기준 0,6,12,18시에 실행 = 한국시간(UTC+9) 기준 9,15,21,3시
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Actions 탭에서 수동으로도 실행할 수 있게

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app to prevent it from sleeping
        run: |
          echo "Ping 1/3..."
          curl -sSL --max-time 60 -o /dev/null -w "HTTP %{http_code}\n" \
            "https://region-analysis-agent.streamlit.app/" || true

          # Streamlit 앱은 첫 요청에 깨어나는 데 시간이 걸릴 수 있어서, 잠깐 텀을 두고 한 번 더 접속
          sleep 15
          echo "Ping 2/3..."
          curl -sSL --max-time 60 -o /dev/null -w "HTTP %{http_code}\n" \
            "https://region-analysis-agent.streamlit.app/" || true

          sleep 15
          echo "Ping 3/3..."
          curl -sSL --max-time 60 -o /dev/null -w "HTTP %{http_code}\n" \
            "https://region-analysis-agent.streamlit.app/" || true
